<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prasoon Music Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff0055">
  <style>
    /* --- MOBILE-FIRST CSS --- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background-color: #0f0f12; color: #ffffff; padding-bottom: 120px; } /* Bottom player ke liye jagah */
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #18181f; border-bottom: 1px solid #282833; }
    .logo { font-size: 1.2rem; font-weight: 800; color: #ff0055; }
    .auth-btn { background: #ff0055; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .user-profile { display: none; align-items: center; gap: 10px; }
    .user-profile img { width: 35px; height: 35px; border-radius: 50%; }
    
    .search-section { display: flex; padding: 15px 5%; gap: 10px; width: 100%; max-width: 600px; margin: auto; }
    .search-section input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #333; background: #1c1c24; color: #fff; outline: none; font-size: 14px; }
    .search-section button { padding: 12px 20px; background: #252533; color: #fff; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
    
    .fav-singers { display: flex; gap: 10px; overflow-x: auto; padding: 0 5% 15px; width: 100%; max-width: 600px; margin: auto; scrollbar-width: none; }
    .fav-singers::-webkit-scrollbar { display: none; }
    .singer-tag { padding: 8px 16px; background: #1c1c24; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
    .singer-tag:hover { background: #ff0055; border-color: #ff0055; }

    .player-container { width: 90%; max-width: 500px; margin: 10px auto; padding: 20px; background: #18181f; border-radius: 20px; text-align: center; border: 1px solid #282833; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .mode-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; background: #121217; padding: 6px; border-radius: 25px; }
    .mode-btn { flex: 1; background: transparent; color: #888; border: none; padding: 8px 0; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; }
    .mode-btn.active { background: #ff0055; color: #fff; }
    
    .screen-box { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    
    /* Playback Fix: Never use display:none for iframes */
    #video-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; transition: opacity 0.3s; }
    .audio-mode-active #video-wrapper { opacity: 0; pointer-events: none; z-index: -1; }
    
    .audio-display { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; z-index: 5; background: #000; }
    .rotating-disc { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 25px rgba(255, 0, 85, 0.3); }
    .rotating-disc.spin { animation: spin 8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .tab-section { width: 90%; max-width: 600px; margin: 25px auto 15px; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid #282833; }
    .tab-btn { background: none; border: none; color: #888; font-size: 15px; font-weight: bold; cursor: pointer; padding-bottom: 10px; transition: 0.2s; }
    .tab-btn.active { color: #fff; border-bottom: 3px solid #ff0055; }

    .results-section { width: 90%; max-width: 600px; margin: 0 auto; }
    .song-list { display: flex; flex-direction: column; gap: 12px; }
    .song-card { display: flex; align-items: center; gap: 15px; background: #1c1c24; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .song-card:active { background: #252533; border-color: #ff0055; }
    .song-card img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .song-meta { flex: 1; overflow: hidden; }
    .song-meta h4 { font-size: 14px; margin-bottom: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .song-meta p { font-size: 12px; color: #888; }
    .fav-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; color: #555; }
    .fav-btn.loved { color: #ff0055; }

    /* --- SPOTIFY-LIKE BOTTOM PLAYER --- */
    .bottom-player { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181f; border-top: 1px solid #282833; padding: 10px 5%; display: flex; align-items: center; justify-content: space-between; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
    .bp-info { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .bp-info img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
    .bp-text { overflow: hidden; }
    .bp-text h4 { font-size: 14px; margin-bottom: 2px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .bp-text p { font-size: 12px; color: #888; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .bp-controls { display: flex; align-items: center; gap: 15px; }
    .bp-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px; }
    .bp-play-btn { background: #ff0055; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .install-banner { display: none; position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #ff0055; color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; z-index: 100; box-shadow: 0 5px 20px rgba(255,0,85,0.4); width: 80%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Prasoon Music</div>
    <div>
      <button class="auth-btn" id="login-btn">Google Login</button>
      <div class="user-profile" id="user-info">
        <img id="user-img" src="" alt="User">
        <button class="auth-btn" id="logout-btn" style="background: #333;">Logout</button>
      </div>
    </div>
  </header>

  <div class="search-section">
    <input type="text" id="search-input" placeholder="Search songs or artists...">
    <button id="search-btn">Search</button>
  </div>

  <div class="fav-singers">
    <div class="singer-tag" data-singer="Arijit Singh">Arijit Singh</div>
    <div class="singer-tag" data-singer="Shreya Ghoshal">Shreya Ghoshal</div>
    <div class="singer-tag" data-singer="Atif Aslam">Atif Aslam</div>
    <div class="singer-tag" data-singer="The Weeknd">The Weeknd</div>
    <div class="singer-tag" data-singer="Jubin Nautiyal">Jubin Nautiyal</div>
    <div class="singer-tag" data-singer="Badshah">Badshah</div>
  </div>

  <div class="player-container">
    <div class="mode-toggle">
      <button class="mode-btn active" id="audio-mode-btn">🎵 Audio Mode</button>
      <button class="mode-btn" id="video-mode-btn">🎬 Video Mode</button>
    </div>

    <!-- Added audio-mode-active class for safe hiding -->
    <div class="screen-box audio-mode-active" id="screen-box">
      <div class="audio-display">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" id="poster-art" class="rotating-disc" alt="Album Art">
      </div>
      <div id="video-wrapper">
        <div id="yt-player"></div>
      </div>
    </div>
  </div>

  <div class="tab-section">
    <button class="tab-btn active" id="tab-search">Search Results</button>
    <button class="tab-btn" id="tab-fav">Favorites ❤️</button>
  </div>

  <div class="results-section">
    <div class="song-list" id="results-list">
      <p style="color: #666; font-size: 14px; text-align: center; margin-top: 15px;">Search for a song to begin.</p>
    </div>
  </div>

  <!-- SPOTIFY STYLE BOTTOM CONTROLS -->
  <div class="bottom-player">
    <div class="bp-info">
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" id="bp-thumb" alt="thumb">
      <div class="bp-text">
        <h4 id="bp-title">Select a Song</h4>
        <p id="bp-artist">MyBeat Engine</p>
      </div>
    </div>
    <div class="bp-controls">
      <button class="bp-btn" id="btn-prev">⏮</button>
      <button class="bp-play-btn" id="btn-play">▶</button>
      <button class="bp-btn" id="btn-next">⏭</button>
    </div>
  </div>

  <div class="install-banner" id="pwa-install-btn">📲 Install App</div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    // --- FIREBASE SETUP ---
    const firebaseConfig = {
      apiKey: "AIzaSyDwiKbKcpckYDsZfT35E8LvVmhRbrOIczQ",
      authDomain: "prasoon-song.firebaseapp.com",
      projectId: "prasoon-song",
      storageBucket: "prasoon-song.firebasestorage.app",
      messagingSenderId: "636681408672",
      appId: "1:636681408672:web:a3cdda744dd758754d39c5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // --- DOM ELEMENTS ---
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const userImg = document.getElementById("user-img");
    
    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const resultsList = document.getElementById("results-list");
    const singerTags = document.querySelectorAll(".singer-tag");
    
    const audioModeBtn = document.getElementById("audio-mode-btn");
    const videoModeBtn = document.getElementById("video-mode-btn");
    const screenBox = document.getElementById("screen-box");
    const posterArt = document.getElementById("poster-art");
    
    // Bottom Player Elements
    const bpTitle = document.getElementById("bp-title");
    const bpArtist = document.getElementById("bp-artist");
    const bpThumb = document.getElementById("bp-thumb");
    const btnPlay = document.getElementById("btn-play");
    const btnNext = document.getElementById("btn-next");
    const btnPrev = document.getElementById("btn-prev");
    
    const tabSearch = document.getElementById("tab-search");
    const tabFav = document.getElementById("tab-fav");

    let ytPlayer;
    let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
    
    // Playlist System Tracking
    let currentPlaylist = [];
    let currentSongIndex = 0;
    let isPlaying = false;

    // --- AUTHENTICATION ---
    loginBtn.addEventListener("click", () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener("click", () => signOut(auth));
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        userInfo.style.display = "flex";
        userImg.src = user.photoURL || "https://via.placeholder.com/32";
      } else {
        loginBtn.style.display = "block";
        userInfo.style.display = "none";
      }
    });

    // --- YOUTUBE PLAYER ---
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%", width: "100%", videoId: "", 
        playerVars: { 
            autoplay: 1, 
            controls: 1, 
            modestbranding: 1,
            fs: 1, // Fullscreen button enabled in video
            playsinline: 1 
        },
        events: {
            'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            isPlaying = true;
            btnPlay.innerHTML = "⏸";
            posterArt.classList.add("spin");
        } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
            isPlaying = false;
            btnPlay.innerHTML = "▶";
            posterArt.classList.remove("spin");
            
            // Autoplay Next Song
            if (event.data == YT.PlayerState.ENDED) playNext();
        }
    }

    // --- BOTTOM CONTROLS ---
    btnPlay.addEventListener("click", () => {
        if (!ytPlayer) return;
        if (isPlaying) {
            ytPlayer.pauseVideo();
        } else {
            ytPlayer.playVideo();
        }
    });

    btnNext.addEventListener("click", playNext);
    btnPrev.addEventListener("click", playPrev);

    function playNext() {
        if (currentPlaylist.length === 0) return;
        currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length;
        loadSongData(currentSongIndex);
    }

    function playPrev() {
        if (currentPlaylist.length === 0) return;
        currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
        loadSongData(currentSongIndex);
    }

    // --- UI MODE TOGGLE ---
    audioModeBtn.addEventListener("click", () => {
      audioModeBtn.classList.add("active"); videoModeBtn.classList.remove("active");
      screenBox.classList.add("audio-mode-active");
    });
    videoModeBtn.addEventListener("click", () => {
      videoModeBtn.classList.add("active"); audioModeBtn.classList.remove("active");
      screenBox.classList.remove("audio-mode-active");
    });

    // --- YOUTUBE API SEARCH ---
    const YOUTUBE_API_KEY = "AIzaSyCsgzh8SGJvzEt4z7y4aJ7mHIR6NgOE3Xg"; 

    searchBtn.addEventListener("click", () => performSearch(searchInput.value));
    searchInput.addEventListener("keypress", (e) => { if (e.key === "Enter") performSearch(searchInput.value); });
    
    singerTags.forEach(tag => {
      tag.addEventListener("click", () => {
        searchInput.value = tag.getAttribute("data-singer");
        performSearch(searchInput.value);
        tabSearch.click();
      });
    });

    async function performSearch(query) {
      if (!query.trim()) return;
      resultsList.innerHTML = "<p style='text-align:center; color:#ff0055; font-weight:bold;'>Searching...</p>";
      
      const endpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          resultsList.innerHTML = "<p style='text-align:center; color:#888;'>No songs found.</p>";
          return;
        }

        // Search successful, format list for Player
        let formattedItems = data.items.map(item => ({
            videoId: item.id.videoId,
            title: item.snippet.title.replace(/&quot;/g, '"').replace(/&#39;/g, "'"),
            author: item.snippet.channelTitle,
            thumb: item.snippet.thumbnails.high.url
        })).filter(i => i.videoId); // Remove undefined (playlists/channels)

        renderList(formattedItems, false);
      } catch (err) {
        resultsList.innerHTML = "<p style='color:red; text-align:center;'>Network Error.</p>";
      }
    }

    // --- RENDER LIST ---
    function renderList(items, isFavList = false) {
      currentPlaylist = items; // Update the global playlist
      resultsList.innerHTML = "";
      
      if(items.length === 0) {
        resultsList.innerHTML = "<p style='color:#888; text-align:center;'>List is empty.</p>"; return;
      }
      
      items.forEach((item, index) => {
        const isFav = favorites.some(fav => fav.videoId === item.videoId);

        const card = document.createElement("div");
        card.className = "song-card";
        card.innerHTML = `
          <img src="${item.thumb}" alt="thumb">
          <div class="song-meta">
            <h4>${item.title}</h4>
            <p>${item.author}</p>
          </div>
          <button class="fav-btn ${isFav ? 'loved' : ''}">${isFav ? '❤️' : '🤍'}</button>
        `;

        card.querySelector('.song-meta').addEventListener("click", () => { currentSongIndex = index; loadSongData(index); });
        card.querySelector('img').addEventListener("click", () => { currentSongIndex = index; loadSongData(index); });

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(item, favBtn);
          if (isFavList) renderFavorites(); 
        });

        resultsList.appendChild(card);
      });
    }

    // --- LOAD & PLAY ---
    function loadSongData(index) {
      if(!currentPlaylist[index]) return;
      const song = currentPlaylist[index];
      
      // Update Bottom Player UI
      bpTitle.innerHTML = song.title; 
      bpArtist.innerText = song.author; 
      bpThumb.src = song.thumb;
      posterArt.src = song.thumb;
      
      if (ytPlayer && ytPlayer.loadVideoById) { 
          ytPlayer.loadVideoById(song.videoId); 
          ytPlayer.playVideo(); 
          btnPlay.innerHTML = "⏸";
      }
    }

    // --- FAVORITES ---
    function toggleFavorite(songObj, btnElement) {
      const index = favorites.findIndex(fav => fav.videoId === songObj.videoId);
      if (index === -1) {
        favorites.push(songObj);
        btnElement.classList.add('loved'); btnElement.innerText = '❤️';
      } else {
        favorites.splice(index, 1);
        btnElement.classList.remove('loved'); btnElement.innerText = '🤍';
      }
      localStorage.setItem('myFavorites', JSON.stringify(favorites));
    }

    tabSearch.addEventListener("click", () => {
      tabSearch.classList.add("active"); tabFav.classList.remove("active");
      if(searchInput.value) performSearch(searchInput.value);
      else resultsList.innerHTML = "<p style='color: #666; text-align: center;'>Search for a song to begin.</p>";
    });

    tabFav.addEventListener("click", () => renderFavorites());

    function renderFavorites() {
      tabFav.classList.add("active"); tabSearch.classList.remove("active");
      renderList(favorites, true);
    }

    // --- PWA LOGIC ---
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault(); deferredPrompt = e;
      document.getElementById("pwa-install-btn").style.display = "block";
    });
    document.getElementById("pwa-install-btn").addEventListener("click", () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById("pwa-install-btn").style.display = "none"; });
      }
    });
  </script>
</body>
</html>
