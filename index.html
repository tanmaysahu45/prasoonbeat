<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Prasoon Music Player</title>
  <link rel="manifest" href="./manifest.json">
  
  <style>
    /* =========================================
       1. BASE STYLES & RESET
       ========================================= */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --accent: #1db954; /* Spotify Green */
      --bg: #000000;
      --panel: #121212;
      --panel-hover: #282828;
      --text: #ffffff;
      --muted: #a7a7a7;
      --border: #2a2a2a;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }
    
    button, input {
      font: inherit;
      outline: none;
      border: none;
    }
    
    button {
      cursor: pointer;
    }

    /* =========================================
       2. HEADER & NAVIGATION
       ========================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      font-weight: 800;
      font-size: 18px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .logo span {
      color: var(--accent);
    }
    
    .auth-btn {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--text);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .auth-btn:active {
      transform: scale(0.95);
      background: var(--panel-hover);
    }
    
    .user-profile {
      display: none;
      align-items: center;
      gap: 10px;
    }
    
    .user-profile img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    /* =========================================
       3. SEARCH BAR & TAGS
       ========================================= */
    .search-container {
      padding: 12px 16px;
    }
    
    .search-box {
      display: flex;
      background: var(--panel-hover);
      border-radius: 24px;
      padding: 4px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .search-box:focus-within {
      border-color: var(--muted);
      background: var(--panel);
    }
    
    .search-box input {
      flex: 1;
      background: transparent;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
    }
    
    .search-box button {
      background: var(--text);
      color: var(--bg);
      border-radius: 20px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 13px;
    }
    
    .tags-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 12px;
      scrollbar-width: none;
    }
    
    .tags-wrapper::-webkit-scrollbar {
      display: none;
    }
    
    .tag {
      background: var(--panel);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    /* =========================================
       4. TABS & SONG LIST
       ========================================= */
    .tabs {
      display: flex;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    
    .tab {
      background: transparent;
      color: var(--muted);
      padding: 8px 0;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .song-list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    
    .song-card:active {
      background: var(--panel);
      transform: scale(0.98);
    }
    
    .song-card img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--panel);
    }
    
    .song-info {
      flex: 1;
      min-width: 0;
    }
    
    .song-info h4 {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .song-info p {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .fav-btn {
      background: transparent;
      font-size: 18px;
      color: var(--muted);
      padding: 8px;
    }
    
    .fav-btn.active {
      color: var(--accent);
    }

    /* =========================================
       5. BOTTOM MINI PLAYER (Spotify Style)
       ========================================= */
    .mini-player {
      position: fixed;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: var(--panel-hover);
      border-radius: 8px;
      padding: 8px;
      display: none; /* Hidden by default */
      align-items: center;
      gap: 10px;
      z-index: 900;
      border: 1px solid var(--border);
    }
    
    .mini-player img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
    }
    
    .mini-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    
    .mini-info h4 {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .mini-info p {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .ctrl-btn {
      background: transparent;
      color: var(--text);
      font-size: 20px;
      padding: 4px;
    }
    
    .play-btn {
      width: 32px;
      height: 32px;
      background: var(--text);
      color: var(--bg);
      border-radius: 50%;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================
       6. FULL SCREEN EXPANDED PLAYER
       ========================================= */
    .full-player {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #2b2b2b, #000000 80%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }
    
    .full-player.open {
      transform: translateY(0);
    }
    
    .fp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .fp-down {
      background: transparent;
      color: var(--text);
      font-size: 24px;
      padding: 5px;
    }
    
    .fp-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
    }

    /* Media Box (Video / Audio View) */
    .media-container {
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
      aspect-ratio: 1/1;
      border-radius: 8px;
      background: #121212;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    
    .audio-view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #181818;
      z-index: 2;
    }
    
    .audio-view img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-view {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #000;
    }
    
    .video-active .audio-view {
      opacity: 0;
      pointer-events: none;
    }
    
    .media-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      display: flex;
      gap: 6px;
    }
    
    .action-btn {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: white;
      backdrop-filter: blur(4px);
    }

    /* Mode Switcher */
    .mode-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: fit-content;
      margin: 0 auto 20px;
      padding: 4px;
    }
    
    .mode-btn {
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
    }
    
    .mode-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Main Controls & Details */
    .fp-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .fp-text {
      min-width: 0;
      flex: 1;
    }
    
    .fp-text h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .fp-text p {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    
    .main-ctrl-btn {
      font-size: 28px;
      color: var(--text);
      background: transparent;
    }
    
    .main-play-btn {
      width: 64px;
      height: 64px;
      background: var(--text);
      color: var(--bg);
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .status-text {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Background Audio Hack For Lock Screen Playback -->
  <audio id="silent-audio" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <!-- Header Section -->
  <header>
    <div class="logo"><span>⚡</span> Prasoon Music</div>
    <div>
      <button class="auth-btn" id="login-btn">Log in</button>
      <div class="user-profile" id="user-info">
        <img id="user-img" src="" alt="User">
        <button class="auth-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <!-- Search Area -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="What do you want to listen to?" autocomplete="off">
      <button id="search-btn">Search</button>
    </div>
  </div>

  <div class="tags-wrapper">
    <button class="tag">Arijit Singh</button>
    <button class="tag">Shreya Ghoshal</button>
    <button class="tag">Atif Aslam</button>
    <button class="tag">The Weeknd</button>
  </div>

  <!-- Main Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-search">Results</button>
    <button class="tab" id="tab-fav">Liked Songs</button>
  </div>

  <!-- Results List -->
  <div class="song-list" id="results-list">
    <p style="color:var(--muted);text-align:center;margin-top:20px;font-size:13px">Search for a song to start listening.</p>
  </div>

  <!-- Spotify Style Mini Player -->
  <div class="mini-player" id="mini-player">
    <img id="mini-thumb" src="" alt="Thumb">
    <div class="mini-info" id="mini-open">
      <h4 id="mini-title">Song</h4>
      <p id="mini-artist">Artist</p>
    </div>
    <div class="mini-controls">
      <button class="ctrl-btn" id="mini-prev">⏮</button>
      <button class="play-btn" id="mini-play">▶</button>
      <button class="ctrl-btn" id="mini-next">⏭</button>
    </div>
  </div>

  <!-- Full Expanded Player -->
  <div class="full-player" id="full-player">
    <div class="fp-header">
      <button class="fp-down" id="fp-close">⌄</button>
      <div class="fp-title">Now Playing</div>
      <div style="width:24px"></div>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-switch">
      <button class="mode-btn active" id="mode-audio">Audio</button>
      <button class="mode-btn" id="mode-video">Video</button>
    </div>

    <!-- Video/Image Container -->
    <div class="media-container" id="media-container">
      <div class="audio-view"><img id="fp-thumb" src="" alt="Art"></div>
      <div class="video-view"><div id="yt-player"></div></div>
      <div class="media-actions">
        <button class="action-btn" id="mute-btn">🔊</button>
        <button class="action-btn" id="fs-btn">⛶</button>
      </div>
    </div>

    <div class="fp-details">
      <div class="fp-text">
        <h2 id="fp-title">Song</h2>
        <p id="fp-artist">Artist</p>
      </div>
      <button class="fav-btn" id="fp-fav-btn">🤍</button>
    </div>

    <div class="main-controls">
      <button class="main-ctrl-btn" id="fp-prev">⏮</button>
      <button class="main-play-btn" id="fp-play">▶</button>
      <button class="main-ctrl-btn" id="fp-next">⏭</button>
    </div>
    
    <div class="status-text" id="player-status">Player is ready</div>
  </div>

  <!-- =========================================
       JAVASCRIPT LOGIC
       ========================================= -->
  <script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // Configuration Settings
    const firebaseConfig = {
      apiKey: "AIzaSyDwiKbKcpckYDsZfT35E8LvVmhRbrOIczQ",
      authDomain: "prasoon-song.firebaseapp.com",
      projectId: "prasoon-song",
      storageBucket: "prasoon-song.firebasestorage.app",
      messagingSenderId: "636681408672",
      appId: "1:636681408672:web:a3cdda744dd758754d39c5"
    };
    const YOUTUBE_API_KEY = "AIzaSyCsgzh8SGJvzEt4z7y4aJ7mHIR6NgOE3Xg";

    // Initialization
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Helper Function
    const $ = id => document.getElementById(id);
    
    // Global Variables
    let ytPlayer = null;
    let ytReady = false;
    let currentUser = null;
    let currentPlaylist = [];
    let currentSongIndex = 0;
    let favorites = [];
    let unsubFavs = null;
    
    // Attempt to load local favorites just for the UI initially (Will be overridden by Firebase if logged in)
    try { 
      favorites = JSON.parse(localStorage.getItem("pm_favs") || "[]"); 
    } catch(e) {
      console.error("Local storage error", e);
    }

    /* =========================================
       FIREBASE AUTHENTICATION & SYNC (Bug Fixed)
       ========================================= */
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        $('login-btn').style.display = "none";
        $('user-info').style.display = "flex";
        $('user-img').src = user.photoURL || "https://via.placeholder.com/30";
        
        // This is the Real-time Listener. It fetches directly from the database
        // and won't overwrite your cloud data with empty local data.
        unsubFavs = onSnapshot(doc(db, "users", user.uid), (docSnap) => {
          if (docSnap.exists() && docSnap.data().favorites) {
            favorites = docSnap.data().favorites;
            localStorage.setItem("pm_favs", JSON.stringify(favorites)); 
          }
          
          // Re-render tabs if we are currently looking at Liked Songs
          if ($('tab-fav').classList.contains('active')) {
            renderFavs();
          }
          updateFavBtnUI();
        });
      } else {
        currentUser = null;
        if(unsubFavs) unsubFavs();
        $('login-btn').style.display = "block";
        $('user-info').style.display = "none";
      }
    });

    $('login-btn').onclick = () => signInWithPopup(auth, provider);
    $('logout-btn').onclick = () => signOut(auth);

    /* =========================================
       FAVORITES LOGIC
       ========================================= */
    async function toggleFavorite(song) {
      const idx = favorites.findIndex(f => f.videoId === song.videoId);
      
      if (idx > -1) {
        favorites.splice(idx, 1); // Remove if already liked
      } else {
        favorites.push(song);     // Add if not liked
      }

      if (currentUser) {
        // Sync to cloud. The onSnapshot listener above will update the UI automatically.
        await setDoc(doc(db, "users", currentUser.uid), { favorites }, { merge: true });
      } else {
        // Fallback for non-logged-in users
        localStorage.setItem("pm_favs", JSON.stringify(favorites));
        if ($('tab-fav').classList.contains('active')) renderFavs();
        updateFavBtnUI();
      }
    }

    /* =========================================
       YOUTUBE PLAYER & PLAYBACK LOGIC
       ========================================= */
    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player("yt-player", {
        playerVars: { 
          autoplay: 0, 
          controls: 1, 
          playsinline: 1, 
          modestbranding: 1 
        },
        events: {
          onReady: () => { 
            ytReady = true; 
            restoreState(); // Bring back the last played song if exists
          },
          onStateChange: onPlayerStateChange
        }
      });
    };
    
    // Inject YouTube Script dynamically
    document.head.appendChild(Object.assign(document.createElement("script"), {
      src: "https://www.youtube.com/iframe_api"
    }));

    function onPlayerStateChange(event) {
      // PLAYING STATE (Play/Pause Bug Fixed here)
      if (event.data === YT.PlayerState.PLAYING) {
        $('mini-play').innerText = "⏸";
        $('fp-play').innerText = "⏸";
        $('silent-audio').play().catch(()=>{}); // Keep background active
        $('player-status').innerText = "Playing Background Mode Active";
      } 
      // PAUSED STATE
      else if (event.data === YT.PlayerState.PAUSED) {
        $('mini-play').innerText = "▶";
        $('fp-play').innerText = "▶";
      } 
      // ENDED STATE
      else if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    function togglePlay(e) {
      if(e) e.stopPropagation();
      
      // Wake up background audio
      $('silent-audio').play().catch(()=>{});
      
      if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
      
      if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function loadSong(index) {
      if (!currentPlaylist[index]) return;
      
      currentSongIndex = index;
      const song = currentPlaylist[index];
      
      // Update Mini Player UI
      $('mini-player').style.display = 'flex';
      $('mini-thumb').src = song.thumb;
      $('mini-title').innerText = song.title;
      $('mini-artist').innerText = song.author;

      // Update Full Player UI
      $('fp-thumb').src = song.thumb;
      $('fp-title').innerText = song.title;
      $('fp-artist').innerText = song.author;
      
      updateFavBtnUI();
      
      // Save current state so page refresh doesn't kill the session
      localStorage.setItem("pm_last_state", JSON.stringify({ 
        playlist: currentPlaylist, 
        index: currentSongIndex 
      }));

      // Command YouTube Player to play
      if (ytReady && ytPlayer) {
        ytPlayer.loadVideoById({ videoId: song.videoId });
        $('mute-btn').innerText = "🔊";
      }
    }

    function updateFavBtnUI() {
      if(!currentPlaylist[currentSongIndex]) return;
      const isFav = favorites.some(f => f.videoId === currentPlaylist[currentSongIndex].videoId);
      const btn = $('fp-fav-btn');
      btn.innerText = isFav ? "❤️" : "🤍";
      btn.style.color = isFav ? "var(--accent)" : "var(--muted)";
    }

    // Next & Previous Controls
    function playNext(e) { 
      if(e) e.stopPropagation(); 
      if(currentPlaylist.length) {
        loadSong((currentSongIndex + 1) % currentPlaylist.length); 
      }
    }
    
    function playPrev(e) { 
      if(e) e.stopPropagation(); 
      if(currentPlaylist.length) {
        loadSong((currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length); 
      }
    }

    // Attach Playback Listeners
    $('mini-play').onclick = togglePlay; 
    $('fp-play').onclick = togglePlay;
    $('mini-next').onclick = playNext; 
    $('fp-next').onclick = playNext;
    $('mini-prev').onclick = playPrev; 
    $('fp-prev').onclick = playPrev;

    /* =========================================
       UI INTERACTIONS & MODES
       ========================================= */
    $('mini-open').onclick = () => $('full-player').classList.add('open');
    $('fp-close').onclick = () => $('full-player').classList.remove('open');
    
    $('fp-fav-btn').onclick = () => {
      toggleFavorite(currentPlaylist[currentSongIndex]);
    };

    // Video vs Audio Mode Switcher
    $('mode-audio').onclick = () => { 
      $('mode-audio').classList.add('active'); 
      $('mode-video').classList.remove('active'); 
      $('media-container').classList.remove('video-active'); 
    };
    
    $('mode-video').onclick = () => { 
      $('mode-video').classList.add('active'); 
      $('mode-audio').classList.remove('active'); 
      $('media-container').classList.add('video-active'); 
    };
    
    // Mute and Fullscreen options
    $('mute-btn').onclick = () => { 
      if(ytPlayer) { 
        if(ytPlayer.isMuted()) { 
          ytPlayer.unMute(); 
          $('mute-btn').innerText="🔊"; 
        } else { 
          ytPlayer.mute(); 
          $('mute-btn').innerText="🔇"; 
        } 
      } 
    };
    
    $('fs-btn').onclick = () => { 
      const iframe = ytPlayer.getIframe(); 
      if(iframe && iframe.requestFullscreen) {
        iframe.requestFullscreen(); 
      }
    };

    /* =========================================
       SEARCH YOUTUBE API LOGIC
       ========================================= */
    $('search-btn').onclick = () => performSearch($('search-input').value);
    
    $('search-input').onkeydown = e => { 
      if(e.key === "Enter") performSearch($('search-input').value); 
    };
    
    document.querySelectorAll('.tag').forEach(tag => {
      tag.onclick = () => { 
        $('search-input').value = tag.innerText; 
        $('tab-search').click(); 
        performSearch(tag.innerText); 
      };
    });

    async function performSearch(query) {
      if (!query.trim()) return;
      $('results-list').innerHTML = '<p style="text-align:center;color:var(--muted)">Searching...</p>';
      
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        
        if (data.items) {
          currentPlaylist = data.items.map(i => ({
            videoId: i.id.videoId, 
            title: decodeHtml(i.snippet.title), 
            author: i.snippet.channelTitle,
            thumb: i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url
          }));
          renderList(currentPlaylist);
        }
      } catch (err) { 
        $('results-list').innerHTML = '<p style="text-align:center;color:#ff5555">Error searching.</p>'; 
      }
    }

    /* =========================================
       RENDERING & TABS LOGIC
       ========================================= */
    function renderList(items) {
      const list = $('results-list'); 
      list.innerHTML = "";
      
      if(!items.length) { 
        list.innerHTML = '<p style="text-align:center;color:var(--muted)">No results.</p>'; 
        return; 
      }
      
      items.forEach((song, idx) => {
        const isFav = favorites.some(f => f.videoId === song.videoId);
        const card = document.createElement('div'); 
        card.className = 'song-card';
        
        card.innerHTML = `
          <img src="${song.thumb}" alt="Cover">
          <div class="song-info">
            <h4>${song.title}</h4>
            <p>${song.author}</p>
          </div>
          <button class="fav-btn ${isFav ? 'active' : ''}">${isFav ? '❤️' : '🤍'}</button>
        `;
        
        card.querySelector('.song-info').onclick = () => { 
          currentPlaylist = items; 
          loadSong(idx); 
          $('full-player').classList.add('open'); 
        };
        
        card.querySelector('img').onclick = card.querySelector('.song-info').onclick;
        
        const btn = card.querySelector('.fav-btn');
        btn.onclick = (e) => { 
          e.stopPropagation(); 
          toggleFavorite(song); 
          btn.innerText = favorites.some(f => f.videoId === song.videoId) ? '❤️' : '🤍'; 
          btn.classList.toggle('active'); 
        };
        
        list.appendChild(card);
      });
    }

    $('tab-search').onclick = () => { 
      $('tab-search').classList.add('active'); 
      $('tab-fav').classList.remove('active'); 
      renderList(currentPlaylist); 
    };
    
    $('tab-fav').onclick = renderFavs;
    
    function renderFavs() { 
      $('tab-fav').classList.add('active'); 
      $('tab-search').classList.remove('active'); 
      renderList(favorites); 
    }

    // Helper: Decode messy HTML characters from YouTube API
    function decodeHtml(html) { 
      const txt = document.createElement("textarea"); 
      txt.innerHTML = html; 
      return txt.value; 
    }
    
    // Restores the last active session when page loads
    function restoreState() {
      try { 
        const stateStr = localStorage.getItem("pm_last_state");
        const s = JSON.parse(stateStr); 
        if(s && s.playlist && s.playlist.length > 0) { 
          currentPlaylist = s.playlist; 
          currentSongIndex = s.index; 
          renderList(currentPlaylist); 
          updateFavBtnUI(); 
          
          const activeSong = currentPlaylist[currentSongIndex];
          
          $('mini-player').style.display = 'flex'; 
          $('mini-thumb').src = $('fp-thumb').src = activeSong.thumb; 
          $('mini-title').innerText = $('fp-title').innerText = activeSong.title; 
          $('mini-artist').innerText = $('fp-artist').innerText = activeSong.author; 
        } 
      } catch(e) {
        console.error("Could not restore session state.", e);
      }
    }
  </script>
</body>
</html>
