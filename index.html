<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff0055">
  <title>Prasoon Music Player</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    :root{--pink:#ff0055;--bg:#0b0b10;--panel:#15151d;--panel2:#1d1d27;--line:#2b2b38;--muted:#8d8d9d}
    body{background:radial-gradient(circle at top,#19111a 0,#0b0b10 42%);color:#fff;min-height:100vh;padding-bottom:110px}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    header{position:sticky;top:0;z-index:100;background:rgba(15,15,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between}
    .logo{font-weight:900;font-size:20px;color:var(--pink);letter-spacing:-.4px}
    .auth-btn,.search-section button{border:1px solid var(--pink);background:transparent;color:#fff;border-radius:999px;padding:9px 15px;font-weight:700;transition:.18s}
    .auth-btn:active,.search-section button:active,.mode-btn:active,.tab-btn:active,.bp-btn:active,.bp-play-btn:active,.screen-action:active{transform:scale(.92)}
    .user-profile{display:none;align-items:center;gap:8px}
    .user-profile img{width:34px;height:34px;border-radius:50%;object-fit:cover}
    .search-section{width:90%;max-width:680px;margin:18px auto 10px;display:flex;gap:9px}
    .search-section input{min-width:0;flex:1;padding:13px 17px;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:999px;outline:none}
    .search-section input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,0,85,.12)}
    .search-section button{padding:12px 20px}
    .fav-singers{width:90%;max-width:680px;margin:auto;display:flex;gap:8px;overflow:auto;padding:2px 0 13px;scrollbar-width:none}
    .fav-singers::-webkit-scrollbar{display:none}
    .singer-tag{white-space:nowrap;padding:8px 13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:13px;color:#ddd;transition:.18s}
    .singer-tag:hover{border-color:var(--pink);color:#fff}
    .player-container{width:92%;max-width:720px;margin:8px auto 20px;background:linear-gradient(145deg,#191923,#111118);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.42)}
    .mode-toggle{display:flex;gap:6px;background:#0c0c11;border:1px solid var(--line);padding:5px;border-radius:999px;margin-bottom:12px}
    .mode-btn{flex:1;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px;border-radius:999px;font-weight:800;transition:.18s}
    .mode-btn.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 5px 20px rgba(255,0,85,.22)}
    .screen-box{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#000;border:1px solid #30303b}
    .audio-display{position:absolute;inset:0;z-index:2;background:radial-gradient(circle,#21151e,#050507 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.25s}
    .rotating-disc{width:min(38vw,190px);height:min(38vw,190px);border-radius:50%;object-fit:cover;box-shadow:0 0 40px rgba(255,0,85,.23);border:5px solid #262630}
    .rotating-disc.spin{animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .now-playing-small{max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd;font-size:13px}
    #video-wrapper{position:absolute;inset:0;z-index:4;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
    #yt-player,#yt-player iframe{width:100%!important;height:100%!important}
    .video-mode #video-wrapper{opacity:1;pointer-events:auto}
    .video-mode .audio-display{opacity:0;pointer-events:none}
    .screen-actions{position:absolute;right:10px;top:10px;z-index:7;display:flex;gap:7px}
    .screen-action{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.58);color:#fff;backdrop-filter:blur(8px);transition:.18s}
    .screen-message{position:absolute;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#aaa;background:rgba(0,0,0,.35);pointer-events:none}
    .screen-message.hidden{display:none}
    .tab-section{width:92%;max-width:680px;margin:22px auto 13px;display:flex;gap:22px;border-bottom:1px solid var(--line)}
    .tab-btn{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:10px 3px;font-weight:800;transition:.18s}
    .tab-btn.active{color:#fff;border-bottom-color:var(--pink)}
    .results-section{width:92%;max-width:680px;margin:auto}
    .song-list{display:flex;flex-direction:column;gap:10px}
    .song-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid transparent;padding:10px;border-radius:15px;transition:.18s}
    .song-card:hover{border-color:#3a3a48;transform:translateY(-1px)}
    .song-card:active{transform:scale(.985);border-color:var(--pink)}
    .song-card img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
    .song-meta{min-width:0;flex:1}
    .song-meta h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .song-meta p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fav-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#777;font-size:19px;transition:.18s;flex:none}
    .fav-btn.loved{color:var(--pink);border-color:var(--pink)}
    .bottom-player{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:rgba(20,20,27,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:10px 4%;display:flex;align-items:center;gap:12px;box-shadow:0 -12px 35px rgba(0,0,0,.35)}
    .bp-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .bp-info img{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none}
    .bp-text{min-width:0}
    .bp-text h4,.bp-text p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bp-text h4{font-size:13px;margin-bottom:3px}
    .bp-text p{font-size:11px;color:var(--muted)}
    .bp-controls{display:flex;align-items:center;gap:5px}
    .bp-btn,.bp-play-btn{border:1px solid transparent;background:transparent;color:#fff;width:39px;height:39px;border-radius:50%;transition:.18s}
    .bp-btn{font-size:18px}
    .bp-play-btn{background:var(--pink);border-color:var(--pink);font-size:17px;box-shadow:0 5px 20px rgba(255,0,85,.25)}
    .status{font-size:11px;color:var(--muted);text-align:center;margin:9px auto 0}
    .install-banner{display:none;position:fixed;z-index:1100;bottom:85px;left:50%;transform:translateX(-50%);border:1px solid var(--pink);background:#171019;color:#fff;padding:11px 20px;border-radius:999px;font-weight:800}
    @media(max-width:600px){
      header{padding:12px 4%}.logo{font-size:17px}.auth-btn{padding:8px 11px;font-size:12px}
      .search-section button{padding:11px 15px}
      .bottom-player{padding:9px 3%;gap:5px}.bp-info img{width:43px;height:43px}.bp-controls{gap:0}.bp-btn,.bp-play-btn{width:36px;height:36px}
      .bp-btn:first-child,.bp-btn:last-child{font-size:16px}
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">⚡ Prasoon Music</div>
    <div>
      <button class="auth-btn" id="login-btn">Google Login</button>
      <div class="user-profile" id="user-info">
        <img id="user-img" src="" alt="User">
        <button class="auth-btn" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <div class="search-section">
    <input id="search-input" type="search" placeholder="Search songs or artists..." autocomplete="off">
    <button id="search-btn">Search</button>
  </div>

  <div class="fav-singers">
    <button class="singer-tag" data-singer="Arijit Singh">Arijit Singh</button>
    <button class="singer-tag" data-singer="Shreya Ghoshal">Shreya Ghoshal</button>
    <button class="singer-tag" data-singer="Atif Aslam">Atif Aslam</button>
    <button class="singer-tag" data-singer="The Weeknd">The Weeknd</button>
    <button class="singer-tag" data-singer="Jubin Nautiyal">Jubin Nautiyal</button>
    <button class="singer-tag" data-singer="Badshah">Badshah</button>
  </div>

  <main class="player-container">
    <div class="mode-toggle">
      <button class="mode-btn active" id="audio-mode-btn">🎵 Audio Mode</button>
      <button class="mode-btn" id="video-mode-btn">🎬 Video Mode</button>
    </div>

    <div class="screen-box" id="screen-box">
      <div class="audio-display">
        <img id="poster-art" class="rotating-disc" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Album Art">
        <div class="now-playing-small" id="now-playing-small">Select a song to start</div>
      </div>

      <div id="video-wrapper">
        <div id="yt-player"></div>
      </div>

      <div class="screen-actions">
        <button class="screen-action" id="mute-btn" title="Mute / Unmute">🔊</button>
        <button class="screen-action" id="fullscreen-btn" title="Fullscreen">⛶</button>
      </div>

      <div class="screen-message" id="screen-message">Search a song, then tap a result to play it.</div>
    </div>

    <div class="status" id="player-status">Player is ready when YouTube finishes loading.</div>
  </main>

  <div class="tab-section">
    <button class="tab-btn active" id="tab-search">Search Results</button>
    <button class="tab-btn" id="tab-fav">Favorites ❤️</button>
  </div>

  <section class="results-section">
    <div class="song-list" id="results-list">
      <p style="color:#666;text-align:center;margin:15px 0">Search for a song to begin.</p>
    </div>
  </section>

  <div class="bottom-player">
    <div class="bp-info">
      <img id="bp-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120" alt="thumb">
      <div class="bp-text">
        <h4 id="bp-title">Select a Song</h4>
        <p id="bp-artist">Prasoon Music</p>
      </div>
    </div>
    <div class="bp-controls">
      <button class="bp-btn" id="btn-prev" title="Previous">⏮</button>
      <button class="bp-play-btn" id="btn-play" title="Play / Pause">▶</button>
      <button class="bp-btn" id="btn-next" title="Next">⏭</button>
    </div>
  </div>

  <div class="install-banner" id="pwa-install-btn">📲 Install App</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    /* =========================
       CONFIG
       ========================= */
    const firebaseConfig = {
      apiKey: "AIzaSyDwiKbKcpckYDsZfT35E8LvVmhRbrOIczQ",
      authDomain: "prasoon-song.firebaseapp.com",
      projectId: "prasoon-song",
      storageBucket: "prasoon-song.firebasestorage.app",
      messagingSenderId: "636681408672",
      appId: "1:636681408672:web:a3cdda744dd758754d39c5"
    };

    const YOUTUBE_API_KEY = "AIzaSyCsgzh8SGJvzEt4z7y4aJ7mHIR6NgOE3Xg";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    /* =========================
       DOM
       ========================= */
    const $ = id => document.getElementById(id);
    const loginBtn = $("login-btn");
    const logoutBtn = $("logout-btn");
    const userInfo = $("user-info");
    const userImg = $("user-img");

    const searchInput = $("search-input");
    const searchBtn = $("search-btn");
    const resultsList = $("results-list");

    const audioModeBtn = $("audio-mode-btn");
    const videoModeBtn = $("video-mode-btn");
    const screenBox = $("screen-box");
    const posterArt = $("poster-art");
    const nowPlayingSmall = $("now-playing-small");
    const screenMessage = $("screen-message");
    const playerStatus = $("player-status");

    const bpTitle = $("bp-title");
    const bpArtist = $("bp-artist");
    const bpThumb = $("bp-thumb");
    const btnPlay = $("btn-play");
    const btnNext = $("btn-next");
    const btnPrev = $("btn-prev");
    const muteBtn = $("mute-btn");
    const fullscreenBtn = $("fullscreen-btn");

    const tabSearch = $("tab-search");
    const tabFav = $("tab-fav");

    /* =========================
       STATE
       ========================= */
    let ytPlayer = null;
    let ytReady = false;
    let isPlaying = false;
    let isMuted = false;
    let pendingVideoId = null;
    let currentPlaylist = [];
    let currentSongIndex = 0;
    let favorites = JSON.parse(localStorage.getItem("myFavorites") || "[]");

    /* =========================
       YOUTUBE IFRAME API
       IMPORTANT FIX:
       The callback is registered BEFORE
       loading the YouTube API. This avoids
       the original race-condition bug.
       ========================= */
    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player("yt-player", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: {
          autoplay: 0,
          controls: 1,
          fs: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          enablejsapi: 1
        },
        events: {
          onReady: onYouTubeReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    };

    const ytScript = document.createElement("script");
    ytScript.src = "https://www.youtube.com/iframe_api";
    ytScript.async = true;
    document.head.appendChild(ytScript);

    function onYouTubeReady() {
      ytReady = true;
      playerStatus.textContent = "YouTube player ready.";
      if (pendingVideoId) {
        const id = pendingVideoId;
        pendingVideoId = null;
        playVideoId(id);
      }
    }

    function onPlayerStateChange(event) {
      if (!window.YT) return;

      switch (event.data) {
        case YT.PlayerState.PLAYING:
          isPlaying = true;
          btnPlay.textContent = "⏸";
          posterArt.classList.add("spin");
          screenMessage.classList.add("hidden");
          playerStatus.textContent = "Playing";
          break;

        case YT.PlayerState.PAUSED:
          isPlaying = false;
          btnPlay.textContent = "▶";
          posterArt.classList.remove("spin");
          playerStatus.textContent = "Paused";
          break;

        case YT.PlayerState.BUFFERING:
          playerStatus.textContent = "Buffering…";
          break;

        case YT.PlayerState.ENDED:
          isPlaying = false;
          btnPlay.textContent = "▶";
          posterArt.classList.remove("spin");
          playNext();
          break;

        case YT.PlayerState.CUED:
          playerStatus.textContent = "Ready to play";
          break;
      }
    }

    function onPlayerError(event) {
      isPlaying = false;
      btnPlay.textContent = "▶";

      const messages = {
        2: "Invalid YouTube video ID.",
        5: "This video cannot be played in this HTML5 player.",
        100: "Video not found or private.",
        101: "This video does not allow embedded playback.",
        150: "This video does not allow embedded playback."
      };

      playerStatus.textContent = messages[event.data] || "YouTube playback error.";
      screenMessage.textContent = messages[event.data] || "This video cannot be played here.";
      screenMessage.classList.remove("hidden");
    }

    /* =========================
       AUTH
       ========================= */
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error(err);
        alert("Google Login failed. Check Firebase Authentication settings.");
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        loginBtn.style.display = "none";
        userInfo.style.display = "flex";
        userImg.src = user.photoURL || "https://via.placeholder.com/40";
      } else {
        loginBtn.style.display = "block";
        userInfo.style.display = "none";
      }
    });

    /* =========================
       SEARCH
       ========================= */
    searchBtn.addEventListener("click", () => performSearch(searchInput.value));

    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") performSearch(searchInput.value);
    });

    document.querySelectorAll(".singer-tag").forEach(tag => {
      tag.addEventListener("click", () => {
        searchInput.value = tag.dataset.singer;
        tabSearch.click();
        performSearch(searchInput.value);
      });
    });

    async function performSearch(query) {
      query = query.trim();
      if (!query) return;

      resultsList.innerHTML = '<p style="text-align:center;color:#ff0055;font-weight:800">Searching…</p>';

      const endpoint =
        "https://www.googleapis.com/youtube/v3/search" +
        "?part=snippet" +
        "&type=video" +
        "&videoEmbeddable=true" +
        "&maxResults=15" +
        "&q=" + encodeURIComponent(query) +
        "&key=" + encodeURIComponent(YOUTUBE_API_KEY);

      try {
        const res = await fetch(endpoint);
        const data = await res.json();

        if (!res.ok || data.error) {
          console.error(data);
          resultsList.innerHTML =
            '<p style="text-align:center;color:#ff667f">YouTube Search API error. Check API key, quota and API restrictions.</p>';
          return;
        }

        const items = (data.items || [])
          .filter(item => item.id && item.id.videoId)
          .map(item => ({
            videoId: item.id.videoId,
            title: decodeHtml(item.snippet.title),
            author: item.snippet.channelTitle,
            thumb: item.snippet.thumbnails?.high?.url ||
                   item.snippet.thumbnails?.medium?.url ||
                   item.snippet.thumbnails?.default?.url
          }));

        if (!items.length) {
          resultsList.innerHTML = '<p style="text-align:center;color:#888">No playable videos found.</p>';
          return;
        }

        currentPlaylist = items;
        currentSongIndex = 0;
        renderList(items, false);
      } catch (err) {
        console.error(err);
        resultsList.innerHTML = '<p style="text-align:center;color:#ff667f">Network error. Check your internet connection.</p>';
      }
    }

    function decodeHtml(value) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = value;
      return textarea.value;
    }

    /* =========================
       LIST
       ========================= */
    function renderList(items, isFavList = false) {
      currentPlaylist = items;
      resultsList.innerHTML = "";

      if (!items.length) {
        resultsList.innerHTML = '<p style="color:#888;text-align:center">List is empty.</p>';
        return;
      }

      items.forEach((song, index) => {
        const loved = favorites.some(x => x.videoId === song.videoId);

        const card = document.createElement("div");
        card.className = "song-card";

        const img = document.createElement("img");
        img.src = song.thumb;
        img.alt = "Thumbnail";
        img.loading = "lazy";

        const meta = document.createElement("div");
        meta.className = "song-meta";
        meta.innerHTML = `<h4></h4><p></p>`;
        meta.querySelector("h4").textContent = song.title;
        meta.querySelector("p").textContent = song.author;

        const fav = document.createElement("button");
        fav.className = "fav-btn" + (loved ? " loved" : "");
        fav.textContent = loved ? "❤️" : "🤍";
        fav.title = "Favorite";

        card.append(img, meta, fav);

        const select = () => {
          currentSongIndex = index;
          loadSongData(index);
        };

        img.addEventListener("click", select);
        meta.addEventListener("click", select);

        fav.addEventListener("click", e => {
          e.stopPropagation();
          toggleFavorite(song, fav);
          if (isFavList) renderFavorites();
        });

        card.addEventListener("click", e => {
          if (e.target !== fav && e.target !== img) select();
        });

        resultsList.appendChild(card);
      });
    }

    /* =========================
       PLAYBACK
       ========================= */
    function loadSongData(index) {
      if (!currentPlaylist[index]) return;

      const song = currentPlaylist[index];

      bpTitle.textContent = song.title;
      bpArtist.textContent = song.author;
      bpThumb.src = song.thumb;
      posterArt.src = song.thumb;
      nowPlayingSmall.textContent = song.title;

      screenMessage.classList.add("hidden");

      if (!ytReady || !ytPlayer) {
        pendingVideoId = song.videoId;
        playerStatus.textContent = "Loading YouTube player…";
        return;
      }

      playVideoId(song.videoId);
    }

    function playVideoId(videoId) {
      if (!ytPlayer) return;

      try {
        ytPlayer.loadVideoById({
          videoId,
          startSeconds: 0
        });

        /* This call happens from a user action when the song
           is selected or the play button is pressed. */
        ytPlayer.unMute();
        isMuted = false;
        muteBtn.textContent = "🔊";

        ytPlayer.playVideo();
        playerStatus.textContent = "Starting…";
      } catch (err) {
        console.error(err);
        playerStatus.textContent = "Could not start playback.";
      }
    }

    btnPlay.addEventListener("click", () => {
      if (!ytReady || !ytPlayer) {
        playerStatus.textContent = "YouTube player is still loading…";
        return;
      }

      if (!currentPlaylist.length) {
        playerStatus.textContent = "Search and select a song first.";
        return;
      }

      if (!ytPlayer.getVideoData().video_id) {
        loadSongData(currentSongIndex);
        return;
      }

      try {
        if (isPlaying) {
          ytPlayer.pauseVideo();
        } else {
          /* User gesture: browser is much more likely to allow sound here. */
          ytPlayer.unMute();
          isMuted = false;
          muteBtn.textContent = "🔊";
          ytPlayer.playVideo();
        }
      } catch (err) {
        console.error(err);
      }
    });

    btnNext.addEventListener("click", playNext);
    btnPrev.addEventListener("click", playPrev);

    function playNext() {
      if (!currentPlaylist.length) return;
      currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length;
      loadSongData(currentSongIndex);
    }

    function playPrev() {
      if (!currentPlaylist.length) return;
      currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadSongData(currentSongIndex);
    }

    /* =========================
       AUDIO / VIDEO MODE
       ========================= */
    audioModeBtn.addEventListener("click", () => {
      audioModeBtn.classList.add("active");
      videoModeBtn.classList.remove("active");
      screenBox.classList.remove("video-mode");
      playerStatus.textContent = isPlaying ? "Playing in Audio Mode" : "Audio Mode";
    });

    videoModeBtn.addEventListener("click", () => {
      videoModeBtn.classList.add("active");
      audioModeBtn.classList.remove("active");
      screenBox.classList.add("video-mode");

      /* User clicked the mode button, so unmute/play is allowed
         by normal browser user-gesture rules. */
      if (ytReady && ytPlayer && ytPlayer.getVideoData().video_id) {
        ytPlayer.unMute();
        isMuted = false;
        muteBtn.textContent = "🔊";
        if (!isPlaying) ytPlayer.playVideo();
      }

      playerStatus.textContent = isPlaying ? "Playing in Video Mode" : "Video Mode";
    });

    /* =========================
       SOUND
       ========================= */
    muteBtn.addEventListener("click", () => {
      if (!ytReady || !ytPlayer) return;

      if (isMuted) {
        ytPlayer.unMute();
        isMuted = false;
        muteBtn.textContent = "🔊";
      } else {
        ytPlayer.mute();
        isMuted = true;
        muteBtn.textContent = "🔇";
      }
    });

    /* =========================
       FULLSCREEN
       ========================= */
    fullscreenBtn.addEventListener("click", async () => {
      if (!ytReady || !ytPlayer) return;

      const iframe = ytPlayer.getIframe();

      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }

        if (iframe && iframe.requestFullscreen) {
          await iframe.requestFullscreen();
          return;
        }

        if (screenBox.requestFullscreen) {
          await screenBox.requestFullscreen();
        }
      } catch (err) {
        console.warn("Fullscreen request failed:", err);
        playerStatus.textContent = "Use YouTube's fullscreen button inside the video.";
      }
    });

    /* =========================
       FAVORITES
       ========================= */
    function toggleFavorite(song, button) {
      const index = favorites.findIndex(x => x.videoId === song.videoId);

      if (index === -1) {
        favorites.push(song);
        button.classList.add("loved");
        button.textContent = "❤️";
      } else {
        favorites.splice(index, 1);
        button.classList.remove("loved");
        button.textContent = "🤍";
      }

      localStorage.setItem("myFavorites", JSON.stringify(favorites));
    }

    tabSearch.addEventListener("click", () => {
      tabSearch.classList.add("active");
      tabFav.classList.remove("active");

      if (searchInput.value.trim()) {
        performSearch(searchInput.value);
      } else {
        resultsList.innerHTML = '<p style="color:#666;text-align:center">Search for a song to begin.</p>';
      }
    });

    tabFav.addEventListener("click", renderFavorites);

    function renderFavorites() {
      tabFav.classList.add("active");
      tabSearch.classList.remove("active");
      renderList(favorites, true);
    }

    /* =========================
       PWA
       ========================= */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(err => {
          console.warn("Service worker not registered:", err);
        });
      });
    }

    let deferredPrompt = null;
    const installBtn = $("pwa-install-btn");

    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
